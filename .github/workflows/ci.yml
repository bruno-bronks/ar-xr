# CI da Fase 0. Gates criticos bloqueiam o merge (configurar "required checks" na branch protegida).
# STATUS: escrita mas NAO executada em runner GitHub (sem remoto configurado); os mesmos comandos
# foram executados localmente — ver docs/evidence/phase-0/.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/api/requirements.txt
          pip install --group dev
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Types
        run: mypy
      - name: Tests (unit + contract + property-based)
        run: pytest -q
      - name: Dependency audit
        run: pip-audit -r services/api/requirements.txt

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  compose-smoke:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Start stack
        run: docker compose up --build --wait --wait-timeout 120
      - name: Smoke tests against real Postgres + Mosquitto
        run: |
          pip install pytest
          BASE_URL=http://127.0.0.1:8088 pytest -q tests/integration
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop stack
        if: always()
        run: docker compose down -v
