# Ambiente LOCAL de desenvolvimento. Nao e configuracao de producao.
# Portas publicadas somente em 127.0.0.1 (REQ-SEC-002). Valores padrao ficticios e "dev-only".
name: spatial-ai

x-database-url: &database_url postgresql+psycopg://${POSTGRES_USER:-spatial}:${POSTGRES_PASSWORD:-spatial-dev-only}@db:5432/${POSTGRES_DB:-spatial}

services:
  db:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-spatial}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spatial-dev-only}
      POSTGRES_DB: ${POSTGRES_DB:-spatial}
    ports:
      - "127.0.0.1:${DB_PORT:-55432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  broker:
    image: eclipse-mosquitto:2.0.18
    ports:
      - "127.0.0.1:${MQTT_PORT:-1883}:1883"
    volumes:
      - ./platform/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - broker-data:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -t '$$SYS/broker/uptime' -C 1 -W 3 >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 3s

  # One-shot: aplica migracoes Alembic e o seed de DEV (idempotente) antes de api/worker.
  migrate:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    command: ["python", "-m", "spatial_storage.migrate"]
    environment:
      DATABASE_URL: *database_url
      SEED_DEV_DATA: "1"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      ENVIRONMENT: development
      AUTH_MODE: demo # tokens ficticios; a API RECUSA iniciar com ENVIRONMENT=production + demo
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: *database_url
      MQTT_HOST: broker
      MQTT_PORT: "1883"
      # Assistente (SPEC-009, D-018): extrativo/offline por padrao; LLM so com provider=llm + chave no .env
      ASSISTANT_PROVIDER: ${ASSISTANT_PROVIDER:-extractive}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "127.0.0.1:${API_PORT:-8088}:8000"
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3).status == 200 else 1)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  worker:
    build:
      context: .
      dockerfile: services/telemetry-worker/Dockerfile
    environment:
      DATABASE_URL: *database_url
      MQTT_HOST: broker
      MQTT_PORT: "1883"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      # heartbeat gravado a cada 5 s enquanto conectado ao broker
      test: ["CMD", "python", "-c", "import os,sys,time; p='/tmp/worker-heartbeat'; sys.exit(0 if os.path.exists(p) and time.time()-os.path.getmtime(p) < 30 else 1)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  simulator:
    build:
      context: .
      dockerfile: services/equipment-simulator/Dockerfile
    environment:
      MQTT_HOST: broker
      MQTT_PORT: "1883"
      SIM_INTERVAL_SECONDS: ${SIM_INTERVAL_SECONDS:-2}
      SIM_CYCLE_TICKS: ${SIM_CYCLE_TICKS:-120}
      SIM_DUPLICATE_EVERY: ${SIM_DUPLICATE_EVERY:-7}
      SIM_LATE_EVERY: ${SIM_LATE_EVERY:-0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      broker:
        condition: service_healthy
      worker:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
  broker-data:
