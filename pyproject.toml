[project]
name = "spatial-ai-platform"
version = "0.1.0"
description = "Spatial AI Platform — AR Maintenance AI e HACC Spatial (workspace de desenvolvimento)"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8",
  "hypothesis>=6",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
  "jsonschema>=4.23",
  "rfc3339-validator>=0.1.4",
  "openapi-spec-validator>=0.7",
  "pyyaml>=6",
  "types-PyYAML",
  "types-jsonschema",
  "pip-audit>=2.7",
  "alembic>=1.13",
  "paho-mqtt>=2.1",
  "playwright>=1.45",
  "segno>=1.6",
  "opencv-python-headless>=4.9",
]

[tool.pytest.ini_options]
pythonpath = ["packages/domain/src", "packages/storage/src", "packages/common/src", "packages/assistant/src", "packages/hacc/src", "ml", "services/api", "services/telemetry-worker", "services/equipment-simulator"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "integration: exige o ambiente Docker Compose em execução (BASE_URL) e/ou PostgreSQL (TEST_DATABASE_URL)",
  "e2e: navegador real (Playwright + Edge) contra o Compose em execução",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S", "C4", "PT", "RUF"]
# E501 desligada: `ruff format` mantem o codigo em 100 colunas; so prosa/strings longas passam disso.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "packages/domain/src:packages/storage/src:packages/common/src:packages/assistant/src:packages/hacc/src:ml:services/api:services/telemetry-worker:services/equipment-simulator"
explicit_package_bases = true
files = ["packages/domain/src", "packages/storage/src", "packages/common/src", "packages/assistant/src", "packages/hacc/src", "ml/spatial_cv", "services/api/app", "services/telemetry-worker/worker", "services/equipment-simulator/simulator", "tests"]
plugins = ["pydantic.mypy"]
