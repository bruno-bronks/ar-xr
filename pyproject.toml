[project]
name = "spatial-ai-platform"
version = "0.1.0"
description = "Spatial AI Platform — AR Maintenance AI e HACC Spatial (workspace de desenvolvimento)"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8",
  "hypothesis>=6",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
  "jsonschema>=4.23",
  "rfc3339-validator>=0.1.4",
  "openapi-spec-validator>=0.7",
  "pyyaml>=6",
  "types-PyYAML",
  "types-jsonschema",
  "pip-audit>=2.7",
]

[tool.pytest.ini_options]
pythonpath = ["packages/domain/src", "services/api"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "integration: exige o ambiente Docker Compose em execução (BASE_URL)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S", "C4", "PT", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "packages/domain/src:services/api"
explicit_package_bases = true
files = ["packages/domain/src", "services/api/app", "tests"]
plugins = ["pydantic.mypy"]
