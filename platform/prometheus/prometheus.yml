# Prometheus da homologacao/dev (SPEC-012, REQ-OPS-005; D-046). Perfil `observability` do Compose:
#   docker compose --profile observability up -d prometheus
# Sem Alertmanager: os alertas ficam visiveis na UI (http://127.0.0.1:9090/alerts). Rotear notificacoes
# (e-mail/Slack/pager) e decisao do usuario e exige servico externo (ver docs/runbooks/observability.md).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.rules.yml

scrape_configs:
  - job_name: api
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /tmp/metrics_token # escrito a partir de METRICS_TOKEN pelo entrypoint do Compose
    static_configs:
      - targets: ["api:8000"]

  - job_name: worker # porta 9100 so na rede interna do Compose (nunca publicada no host)
    static_configs:
      - targets: ["worker:9100"]
