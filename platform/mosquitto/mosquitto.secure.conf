# BROKER ENDURECIDO (opt-in; SPEC-011, REQ-IOT-003, D-039). Use com compose.secure.yaml.
# - sem conexao anonima; senha por usuario (arquivo gerado por scripts/gen_broker_users.py);
# - ACL por dispositivo: o usuario = id do equipamento e so escreve no PROPRIO topico de telemetria.
# AINDA NAO HA TLS: antes de qualquer dispositivo real, TLS (8883) e obrigatorio (ver
# docs/hardware/esp32-electrical-safety-plan.md). Em texto puro, a senha trafega em claro na rede.
listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl
persistence true
persistence_location /mosquitto/data/
log_dest stdout
