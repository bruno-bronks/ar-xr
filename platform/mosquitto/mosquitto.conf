# CONFIGURACAO DEV APENAS — nunca usar fora do ambiente local.
# Conexao anonima habilitada porque o Compose publica a porta somente em 127.0.0.1.
# Fora de dev: autenticacao (password_file/ACL por equipamento) e TLS sao obrigatorios
# (ver docs/architecture/threat-model.md, S-02). Topico MQTT NAO e controle de autorizacao.
listener 1883
allow_anonymous true
persistence true
persistence_location /mosquitto/data/
log_dest stdout
